
name: Update GitHub Stats

on:
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    stats:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Generate GitHub stats
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=HakkoDev&show_icons=true&include_all_commits=true&show=contributions&hide_border=true
                  path: profile/stats.svg
                  token: ${{ secrets.STATS_TOKEN }}

            - name: Generate language stats
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=HakkoDev&layout=compact&langs_count=10hide_border=true
                  path: profile/languages.svg
                  token: ${{ secrets.STATS_TOKEN }}

            - name: Commit updated cards
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile/*.svg
                  if ! git diff --cached --quiet; then
                      git commit -m "chore(stats): update profile cards"
                      git push
                  fi
